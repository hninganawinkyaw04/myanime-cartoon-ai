
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Cartoon Studio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg,#100d24,#352052);
}
.card {
  max-width: 520px;
  margin: 15px auto;
  padding: 22px;
  background: #211a3d;
  border-radius: 20px;
}
h1 { color: #e2b6ff; text-align: center; }
p { line-height: 1.6; color: #ddd4ee; }
label { display: block; margin-top: 16px; }
textarea, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
textarea { min-height: 120px; }
button {
  margin-top: 20px;
  background: #a56bff;
  color: white;
  font-weight: bold;
}
#result {
  white-space: pre-wrap;
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #30254c;
}
.note { font-size: 13px; }
</style>
</head>
<body>
<div class="card">
<h1>✨ AI Cartoon Studio</h1>
<p>Create your own cartoon story!</p>

<label for="style">Choose Cartoon Style</label>
<select id="style">
<option>Anime</option>
<option>2D Cartoon</option>
<option>3D Cartoon</option>
<option>Fantasy Cartoon</option>
<option>Fairy Tale</option>
<option>Animal Cartoon</option>
<option>Adventure Cartoon</option>
<option>Action and Fighting</option>
</select>

<label for="story">Describe Your Story</label>
<textarea id="story" placeholder="Example: A princess discovers magical powers and saves her kingdom..."></textarea>

<label for="duration">Choose Video Length</label>
<select id="duration">
<option>30 seconds</option>
<option>1 minute</option>
<option>3 minutes</option>
<option>5 minutes</option>
</select>

<button onclick="createPlan()">Create My Cartoon Plan</button>
<div id="result" hidden></div>

<p class="note">This is a free website prototype. Actual AI video generation requires connecting an AI video service.</p>
</div>

<script>
function createPlan() {
  const style = document.getElementById("style").value;
  const story = document.getElementById("story").value.trim();
  const duration = document.getElementById("duration").value;
  const result = document.getElementById("result");

  result.hidden = false;

  if (!story) {
    result.textContent = "Please write your story first.";
    return;
  }

  result.textContent =
    "YOUR CARTOON PROJECT\n\n" +
    "Style: " + style + "\n" +
    "Duration: " + duration + "\n\n" +
    "Your Story:\n" + story + "\n\n" +
    "Next step: Connect an AI video generator to create the actual video.";
}
</script>
</body>
  </html>
