
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Magic Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #100d24;
      color: white;
    }
    .card {
      max-width: 520px;
      margin: 25px auto;
      padding: 24px;
      background: #211a3d;
      border-radius: 20px;
    }
    h1 {
      color: #d9a7ff;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #d2c8e8;
    }
    label {
      display: block;
      margin-top: 18px;
    }
    textarea, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 9px;
      border-radius: 10px;
      font-size: 16px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      border: none;
      background: #a56bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 18px;
      padding: 12px;
      background: #30254c;
      border-radius: 10px;
      line-height: 1.6;
    }
    .note {
      font-size: 13px;
      color: #d2c8e8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>✨ Anime Magic Studio</h1>
    <p class="subtitle">Bring your fantasy story to life!</p>

    <label for="story">Describe your anime story</label>
    <textarea id="story" placeholder="Example: A princess discovers a magical power..."></textarea>

    <label for="style">Choose your anime style</label>
    <select id="style">
      <option>Fantasy Magic</option>
      <option>Anime Princess</option>
      <option>Action and Fighting</option>
      <option>Magical Kingdom</option>
    </select>

    <label for="duration">Video duration</label>
    <select id="duration">
      <option>30 seconds</option>
      <option>1 minute</option>
      <option>5 minutes</option>
    </select>

    <button onclick="createStory()">Create My Anime Plan</button>

    <div id="result" hidden></div>

    <p class="note">
      This is a free website prototype. It prepares your story idea,
      but does not generate an actual video yet.
    </p>
  </main>

  <script>
    function createStory() {
      const story = document.getElementById("story").value.trim();
      const style = document.getElementById("style").value;
      const duration = document.getElementById("duration").value;
      const result = document.getElementById("result");

      result.hidden = false;

      if (!story) {
        result.textContent = "Please describe your anime story first.";
        return;
      }

      result.replaceChildren();

      const heading = document.createElement("h3");
      heading.textContent = "Your Anime Project ✨";

      const details = document.createElement("p");
      details.textContent =
        "Style: " + style +
        " | Duration: " + duration;

      const description = document.createElement("p");
      description.textContent = "Story idea: " + story;

      const prompt = document.createElement("p");
      prompt.textContent =
        "Next step: Turn this idea into scenes, then connect an AI video generation service.";

      result.append(heading, details, description, prompt);
    }
  </script>
</body>
</html>
